spring:
  application:
    name: finguard-core-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finguard}
    username: ${SPRING_DATASOURCE_USERNAME:finguard}
    password: ${SPRING_DATASOURCE_PASSWORD:finguard}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

finguard:
  jwt:
    secret: ${FINGUARD_JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    expiration-minutes: ${FINGUARD_JWT_EXPIRATION_MINUTES:60}
  ai-service:
    base-url: ${FINGUARD_AI_SERVICE_BASE_URL:http://localhost:8000}
